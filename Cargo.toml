[package]
name = "network-analyzer"
version = "0.1.0"
edition = "2021"
authors = ["Network Traffic Analysis Engine"]
description = "High-performance Rust network traffic analysis, stateful flow tracking, and NIDS feature extraction engine"

[dependencies]
pcap = "2.5"
etherparse = "0.21"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
csv = "1.3"
ctrlc = "3.4"
chrono = { version = "0.4", features = ["serde"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
